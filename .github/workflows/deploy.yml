name: SPM Theme Publisher

on:
  push:
    branches:
      - main
    paths:
      - '**/*/manifest.json'
      - '**/*/vnr_project/**'
      - '**/*/content.css'
  pull_request:
    paths:
      - '**/*/manifest.json'
      - '**/*/vnr_project/**'
      - '**/*/content.css'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_manifests: ${{ steps.resolve-manifests.outputs.manifests }}
      any_changed: ${{ steps.resolve-manifests.outputs.any_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Theme Files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            **/*/manifest.json
            **/*/vnr_project/**
            **/*/content.css

      - name: Resolve Target Theme Manifests
        id: resolve-manifests
        run: |
          RAW_CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          if [ -z "$RAW_CHANGED" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo "manifests=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MANIFEST_LIST=""
          for file in $RAW_CHANGED; do
            case "$file" in
              */vnr_project/*)
                theme_dir=$(echo "$file" | sed -E 's|/vnr_project/.*||')
                manifest_path="$theme_dir/manifest.json"
                ;;
              *)
                theme_dir=$(dirname "$file")
                manifest_path="$theme_dir/manifest.json"
                ;;
            esac

            if [ -f "$manifest_path" ]; then
              MANIFEST_LIST="$MANIFEST_LIST $manifest_path"
            fi
          done

          UNIQUE_MANIFESTS=$(echo "$MANIFEST_LIST" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

          if [ -n "$UNIQUE_MANIFESTS" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            echo "manifests=$UNIQUE_MANIFESTS" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo "manifests=" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Pre-compiled spm-cli Binary
        run: |
          curl -fsSL -o spm https://raw.githubusercontent.com/spm-ecosystem/spm-cli/release-cli/spm
          chmod +x spm
          ./spm help

      - name: Recompile Changed Themes
        run: |
          set -e
          CHANGED="${{ needs.detect-changes.outputs.changed_manifests }}"
          FAILED=0

          echo "$CHANGED" | tr ' ' '\n' | sort -u | while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            theme_dir=$(dirname "$manifest")
            vnr_dir="$theme_dir/vnr_project"

            echo "::group::Validating $theme_dir"

            if [ ! -d "$vnr_dir" ]; then
              echo "::error::$theme_dir does not contain vnr_project/ directory — manifest.json cannot be trusted without VNR source code"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            if ./spm compile "$vnr_dir" -o "/tmp/check-$(echo "$theme_dir" | tr '/' '_').json"; then
              echo "✓ $theme_dir compiled cleanly"
            else
              echo "::error::$theme_dir failed VNR compilation"
              FAILED=1
            fi

            echo "::endgroup::"
          done

          exit $FAILED

  publish-to-edge:
    needs: [detect-changes, validate]
    if: github.event_name == 'push' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    environment: SPM

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sign and Deploy Themes to R2 Edge
        env:
          SPM_DEV_SECRET: ${{ secrets.SPM_DEV_SECRET }}
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_manifests }}
        run: node .github/scripts/publish.js